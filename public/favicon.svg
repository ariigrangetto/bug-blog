<svg viewBox="0 0 64 64" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
    <!-- Dark rounded background -->
    <rect width="64" height="64" rx="14" fill="#050a05" stroke="#00ff41" stroke-opacity="0.3" stroke-width="2" />

    <g transform="translate(0, 7)">
        <!-- Antenna cursor blocks -->
        <rect x="14" y="2" width="5" height="5" fill="#00ff41" />
        <rect x="45" y="2" width="5" height="5" fill="#00ff41" />

        <!-- Antenna lines -->
        <line x1="26" y1="12" x2="18" y2="5" stroke="#00ff41" stroke-width="2" stroke-linecap="square" />
        <line x1="38" y1="12" x2="46" y2="5" stroke="#00ff41" stroke-width="2" stroke-linecap="square" />

        <!-- Head -->
        <rect x="25" y="12" width="14" height="10" fill="#00ff41" />

        <!-- Eyes -->
        <rect x="27" y="14" width="3.5" height="3.5" fill="#050a05" />
        <rect x="33.5" y="14" width="3.5" height="3.5" fill="#050a05" />

        <!-- Body (IC Chip form) -->
        <rect x="21" y="22" width="22" height="24" fill="#00ff41" />

        <!-- Body scan lines -->
        <line x1="22" y1="27" x2="43" y2="27" stroke="#050a05" stroke-width="1" opacity="0.6" />
        <line x1="22" y1="31" x2="43" y2="31" stroke="#050a05" stroke-width="1" opacity="0.6" />
        <line x1="22" y1="35" x2="43" y2="35" stroke="#050a05" stroke-width="1" opacity="0.6" />
        <line x1="22" y1="39" x2="43" y2="39" stroke="#050a05" stroke-width="1" opacity="0.6" />
        <line x1="22" y1="43" x2="43" y2="43" stroke="#050a05" stroke-width="1" opacity="0.6" />

        <!-- Elytra seam -->
        <line x1="32" y1="22" x2="32" y2="46" stroke="#050a05" stroke-width="2.5" />

        <!-- Left legs -->
        <rect x="13" y="24" width="8" height="3" fill="#00ff41" />
        <rect x="13" y="30" width="8" height="3" fill="#00ff41" />
        <rect x="13" y="36" width="8" height="3" fill="#00ff41" />

        <!-- Right legs -->
        <rect x="43" y="24" width="8" height="3" fill="#00ff41" />
        <rect x="43" y="30" width="8" height="3" fill="#00ff41" />
        <rect x="43" y="36" width="8" height="3" fill="#00ff41" />
    </g>
</svg>